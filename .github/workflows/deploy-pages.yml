name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/configure-pages@v5
      - name: Render presentation
        run: quarto render docs/presentation.md
      - name: Add presentation landing page
        run: printf '<!doctype html><meta http-equiv="refresh" content="0; url=presentation.html"><a href="presentation.html">Open presentation</a>\n' > output/docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
